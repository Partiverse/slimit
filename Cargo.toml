[workspace]
resolver = "2"
members = [
    "crates/slimit-core",
    "crates/slimit-rules",
    "crates/slimit-exec",
    "crates/slimit-ai",
    "crates/slimit-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 WITH Commons-Clause"
authors = ["SlimIt contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
