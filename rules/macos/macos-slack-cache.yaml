apiVersion: slimit.rules/v1
id: macos-slack-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/com.tinyspeck.slackmacgap"
semantics:
  title: "Slack 桌面客户端缓存"
  what: "Slack macOS 客户端（Electron 架构）的缓存目录：工作区界面资源、图片与网页资源缓存。消息存于云端，登录凭据在 Keychain 与 Application Support，不在此处"
  producer: "Slack（com.tinyspeck.slackmacgap）"
  safe_to_delete_because: "位于 macOS 约定的 Caches 目录；消息存于云端，缓存可完全重建"
  consequence: "下次启动各工作区需重新加载资源，首启略慢；登录态与消息不受影响"
  regenerate: "客户端运行时按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多工作区用户）"
  recovery: full
refs:
  - https://slack.com/help/articles/115004071768
