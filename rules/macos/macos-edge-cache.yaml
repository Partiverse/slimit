apiVersion: slimit.rules/v1
id: macos-edge-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/Microsoft Edge"
semantics:
  title: "Microsoft Edge 浏览器缓存（~/Library/Caches/Microsoft Edge）"
  what: "Edge 各 profile 的 HTTP 网页资源缓存与 JavaScript 代码缓存。密码、书签、历史、Cookie 存放在 ~/Library/Application Support/Microsoft Edge，不在此处"
  producer: "Microsoft Edge"
  safe_to_delete_because: "全部为浏览器自动生成的派生数据，与 Chromium 的用户数据目录约定分离；Edge 自身提供『清除缓存的图片和文件』且不影响密码书签"
  consequence: "登录状态、密码、书签、历史均不受影响；之后首次访问网站需重新下载资源，加载略慢。建议先退出 Edge 再清理"
  regenerate: "Edge 运行中按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 至数 GB"
  recovery: full
refs:
  - https://learn.microsoft.com/en-us/deployedge/edge-learnmore-create-user-directory-vars
  - https://support.google.com/chrome/answer/2392709
