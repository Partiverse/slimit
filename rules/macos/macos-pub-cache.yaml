apiVersion: slimit.rules/v1
id: macos-pub-cache
os: macos
scope: user
paths:
  - "~/.pub-cache"
semantics:
  title: "Dart/Flutter 全局包缓存（~/.pub-cache）"
  what: "Dart 包管理器 pub 的全局缓存：所有下载过的包版本源码与托管镜像，Flutter/dart 项目依赖解析时引用此处"
  producer: "Dart SDK 的 pub 工具（dart pub get / flutter pub get）"
  safe_to_delete_because: "纯下载缓存：删除后项目内已有依赖副本仍在各自 .dart_tool 中，下次 pub get 按需重新下载"
  consequence: "下次构建时依赖重新下载，需网络；项目本身与锁文件不受影响"
  regenerate: "在各项目中执行 dart pub get / flutter pub get 自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多 Flutter 项目开发者）"
  recovery: full
refs:
  - https://dart.dev/tools/pub/cmd/pub-cache
  - https://docs.flutter.dev/reference/flutter-cli
