apiVersion: slimit.rules/v1
id: macos-teams-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/com.microsoft.teams2"
semantics:
  title: "Microsoft Teams（新版）缓存"
  what: "新版 Teams（Teams 2.x，Electron 架构）的缓存目录：界面资源、网页资源与媒体缓存。聊天记录存于云端，本地配置在 Application Support 下，不在此处"
  producer: "Microsoft Teams（com.microsoft.teams2）"
  safe_to_delete_because: "位于 macOS 约定的 Caches 目录；Teams 聊天记录存于云端，本地缓存可完全重建"
  consequence: "下次启动需重新下载界面与资源缓存，首启略慢；账号与消息不受影响"
  regenerate: "客户端运行时按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB"
  recovery: full
refs:
  - https://learn.microsoft.com/en-us/microsoftteams/new-teams-faq
