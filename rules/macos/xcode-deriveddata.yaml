apiVersion: slimit.rules/v1
id: macos-xcode-deriveddata
os: macos
scope: user
paths:
  - "~/Library/Developer/Xcode/DerivedData"
semantics:
  title: "Xcode 构建产物（DerivedData）"
  what: "Xcode 为每个项目保存的增量构建产物、模块缓存与代码索引"
  producer: "Xcode"
  safe_to_delete_because: "下次打开项目/构建时自动重建，不含源码与任何用户数据"
  consequence: "首次重新构建明显变慢（全量重编译 + 重建索引），无数据丢失"
  regenerate: "自动"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "单项目 1–10 GB，累积可达数十 GB"
  recovery: full
refs:
  - https://developer.apple.com/documentation/xcode
