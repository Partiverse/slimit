apiVersion: slimit.rules/v1
id: macos-cypress-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/Cypress"
semantics:
  title: "Cypress 二进制缓存（~/Library/Caches/Cypress）"
  what: "Cypress E2E 测试框架下载的 Cypress 应用二进制（按版本存放），npm 包仅是壳，真正的桌面应用在此"
  producer: "Cypress（npm install cypress 时自动下载）"
  safe_to_delete_because: "纯下载缓存：删除后下次安装或 cypress open 时重新下载"
  consequence: "下次使用需重新下载 Cypress 应用（每版本约 200 MB），需网络"
  regenerate: "npm install cypress / cypress install 自动下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多版本累计）"
  recovery: full
refs:
  - https://docs.cypress.io/app/get-started/install-cypress
  - https://docs.cypress.io/app/references/advanced-installation#Binary-install-optional
