apiVersion: slimit.rules/v1
id: macos-vscode-cached-data
os: macos
scope: user
paths:
  - "~/Library/Application Support/Code/CachedData"
semantics:
  title: "VS Code 启动缓存（V8 代码缓存）"
  what: "VS Code 自身 JavaScript 代码的 V8 编译缓存（CachedData），按版本 commit hash 分子目录存放，仅用于加速启动；不含扩展、设置与任何用户数据"
  producer: "VS Code（Electron/V8），在安装或更新版本后的启动过程中生成"
  safe_to_delete_because: "纯启动加速缓存，内容完全由本机 VS Code 二进制推导再生，与扩展、设置、工作区数据无关联"
  consequence: "下一次（或几次）启动 VS Code 略慢，缓存随即自动重建；无任何数据损失"
  regenerate: "删除后下次启动 VS Code 自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "每个版本约 10–30 MB，多个版本累计可达 50–200 MB（本机实测 26 MB）"
  recovery: full
refs:
  - https://code.visualstudio.com/docs/setup/uninstall
  - https://code.visualstudio.com/docs/supporting/FAQ
