apiVersion: slimit.rules/v1
id: macos-electron-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/electron"
semantics:
  title: "Electron 二进制下载缓存（~/Library/Caches/electron）"
  what: "@electron/get 下载缓存的 Electron 预编译二进制（zip/headers），供 electron 打包与 npm install electron 使用"
  producer: "@electron/get（electron 包安装时自动下载）"
  safe_to_delete_because: "纯下载缓存：删除后下次安装/打包时重新下载对应版本"
  consequence: "下次 electron 相关安装需重新下载二进制（每版本约 100 MB），需网络"
  regenerate: "npm install electron 或打包时自动下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多版本累计）"
  recovery: full
refs:
  - https://www.electronjs.org/docs/latest/tutorial/installation
