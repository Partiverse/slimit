apiVersion: slimit.rules/v1
id: macos-rustup-downloads
os: macos
scope: user
paths:
  - "~/.rustup/downloads"
semantics:
  title: "rustup 下载临时目录（~/.rustup/downloads）"
  what: "rustup 安装/更新工具链时的下载暂存目录：安装包解压完成后即无用，异常退出时可能残留半成品"
  producer: "rustup（rustup update / toolchain install）"
  safe_to_delete_because: "纯下载临时目录：rustup 文档将其列为临时存储，删除不影响已安装的工具链与 rustup 本身"
  consequence: "无任何功能影响；下次更新时重新下载"
  regenerate: "rustup update 时自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "0–2 GB（更新中断时残留更大）"
  recovery: full
refs:
  - https://rust-lang.github.io/rustup/installation/index.html
