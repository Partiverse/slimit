apiVersion: slimit.rules/v1
id: macos-chrome-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/Google/Chrome"
semantics:
  title: "Google Chrome 浏览器缓存"
  what: "Chrome 为加速网页加载而保存的派生数据：各 profile 的 HTTP 网页资源缓存（Cache/Cache_Data）、JavaScript 代码缓存（Code Cache）等。密码、书签、历史记录、Cookie 等用户数据存放在 ~/Library/Application Support/Google/Chrome，不在此目录"
  producer: "Google Chrome"
  safe_to_delete_because: "全部为浏览器自动生成的派生数据，仅用于加速页面重复加载；Chrome 官方自身提供『清除缓存的图片和文件』选项，并明确该操作不影响密码、书签与历史记录"
  consequence: "登录状态、密码、书签、历史均不受影响；之后首次访问各网站需重新下载资源，加载略慢，用得越多恢复越快。Chrome 正在运行时清理一般也能自动恢复，稳妥起见建议先退出 Chrome"
  regenerate: "无需手动操作，Chrome 运行中按需自动重建目录并重新缓存"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 至数 GB（重度使用或多个 profile 可达 5 GB 以上）"
  recovery: full
refs:
  - https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md
  - https://support.google.com/chrome/answer/2392709
