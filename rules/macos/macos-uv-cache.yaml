apiVersion: slimit.rules/v1
id: macos-uv-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/uv"
semantics:
  title: "uv 包缓存（~/Library/Caches/uv）"
  what: "Astral 的 Python 包管理器 uv 的构建与下载缓存：PyPI 包归档、wheel 构建缓存、托管环境快照，供各项目 uv pip/venv 安装复用"
  producer: "uv（uv pip install / uv sync / uv python）"
  safe_to_delete_because: "官方文档明确缓存目录可以随时安全删除，uv 会在需要时重新下载并重建；也可用官方 uv cache clean"
  consequence: "下次安装依赖需重新下载，需网络；项目虚拟环境（.venv）与 uv.lock 不受影响"
  regenerate: "uv install/sync 自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "1–10 GB（多项目 Python 开发者）"
  recovery: full
refs:
  - https://docs.astral.sh/uv/concepts/cache/
