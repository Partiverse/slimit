apiVersion: slimit.rules/v1
id: macos-<slug>
os: macos
scope: user
paths:
  - "~/Library/Example"
match:
  include: []
  exclude: []
semantics:
  title: "<60 字内标题>"
  what: "<这是什么>"
  producer: "<谁产生的>"
  safe_to_delete_because: "<为何可删>"
  consequence: "<删了会怎样>"
  regenerate: "<如何重建>"
risk: green            # green | yellow | red
red_flags: []          # red 必填
action:
  kind: purge-dir      # purge-dir | command | advise
  delete_contents_only: true
estimate:
  typical_size: "<典型占用>"
  recovery: full
refs:
  - https://developer.apple.com/example
