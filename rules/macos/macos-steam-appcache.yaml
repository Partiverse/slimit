apiVersion: slimit.rules/v1
id: macos-steam-appcache
os: macos
scope: user
paths:
  - "~/Library/Application Support/Steam/appcache"
semantics:
  title: "Steam 客户端缓存（appcache）"
  what: "Steam 桌面客户端的本地缓存：商店/社区网页资源缓存、缩略图包与配置缓存。游戏本体（steamapps）、存档与登录凭据不在此处"
  producer: "Steam 客户端"
  safe_to_delete_because: "纯客户端缓存：删除后 Steam 重建网页与资源缓存；游戏文件（steamapps）与存档（userdata/远程存档）不受影响"
  consequence: "下次启动 Steam 需重建缓存，商店页面首次加载略慢；游戏与存档不受影响"
  regenerate: "客户端运行时按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB"
  recovery: full
refs:
  - https://help.steampowered.com/
