apiVersion: slimit.rules/v1
id: macos-deno-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/deno"
semantics:
  title: "Deno 模块与编译缓存（~/Library/Caches/deno）"
  what: "Deno 运行时的默认 DENO_DIR：远程模块缓存、依赖注册表数据、TypeScript 编译缓存、HTTP 缓存等"
  producer: "Deno（deno run / deno cache）"
  safe_to_delete_because: "纯缓存：Deno 文档说明清空 DENO_DIR 后模块在下次运行时按 lockfile/远程源重新下载编译"
  consequence: "下次运行 Deno 程序需重新下载远程模块并重新编译 TS，需网络；项目源码与 deno.lock 不受影响"
  regenerate: "deno run / deno cache 自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB"
  recovery: full
refs:
  - https://docs.deno.com/runtime/manual/basics/environment_variables/
