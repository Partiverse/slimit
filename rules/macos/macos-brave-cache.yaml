apiVersion: slimit.rules/v1
id: macos-brave-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/BraveSoftware/Brave-Browser"
semantics:
  title: "Brave 浏览器缓存"
  what: "Brave（Chromium 内核）的 HTTP 网页资源缓存与代码缓存，按 profile 存放。密码、书签、历史等用户数据存放在 ~/Library/Application Support/BraveSoftware，不在此处"
  producer: "Brave 浏览器"
  safe_to_delete_because: "全部为浏览器自动生成的派生数据，遵循 Chromium 用户数据目录与缓存分离的约定；浏览器自身『清除浏览数据』也不影响密码书签"
  consequence: "登录状态、密码、书签、历史均不受影响；之后首次访问网站需重新下载资源，加载略慢。建议先退出 Brave"
  regenerate: "浏览器运行中按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 至数 GB"
  recovery: full
refs:
  - https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md
  - https://github.com/brave/brave-browser/wiki
