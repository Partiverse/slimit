apiVersion: slimit.rules/v1
id: macos-parallels-vms
os: macos
scope: user
paths:
  - "~/Parallels"
semantics:
  title: "Parallels Desktop 虚拟机库"
  what: "Parallels Desktop 默认虚拟机目录：每台 Windows/Linux 虚拟机的整块磁盘镜像（.pvm 包，含快照）都在这里"
  producer: "Parallels Desktop"
  safe_to_delete_because: "不可直接删除——等于删除整台虚拟机"
  consequence: "虚拟机及其中的 Windows/Linux 系统、用户文件、快照全部永久丢失"
  regenerate: "只能重新新建虚拟机并安装系统；磁盘内数据不可恢复"
risk: red
red_flags:
  - ".pvm 是完整虚拟机包，删除即毁掉整台虚拟机"
  - "正确方式：在 Parallels Control Center 中删除虚拟机，或至少确认快照与数据已不需要"
action:
  kind: advise
estimate:
  typical_size: "每台虚拟机数 GB 到数百 GB"
  recovery: none
refs:
  - https://kb.parallels.com/
