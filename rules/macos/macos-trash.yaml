apiVersion: slimit.rules/v1
id: macos-trash
os: macos
scope: user
paths:
  - "~/.Trash"
semantics:
  title: "废纸篓（清倒可释放空间）"
  what: "macOS 废纸篓目录。Finder「移到废纸篓」的项目、应用删除的中转文件都暂存在这里，清倒前仍占磁盘。该目录受 TCC 保护，需要完全磁盘访问权限"
  producer: "macOS Finder 的「移到废纸篓」操作，以及各应用删除时的中转"
  safe_to_delete_because: "进入废纸篓通常已代表用户的删除意图，清倒（Empty Trash）是 macOS 官方操作，只完成这个意图。定级 yellow（原 red）是应种子反馈调整：废纸篓本就是弃置区，但清倒不可逆且可能含刚误删项，故走官方命令 + 用户自行确认，不由工具静默代清"
  consequence: "内容被永久删除，「放回原处」信息丢失，无法再从废纸篓恢复；近期误删且想找回的文件会因此丢失"
  regenerate: "无法重建，不可逆。~/.Trash 目录本身保留"
risk: yellow
action:
  kind: command
  command: "osascript -e 'tell application \"Finder\" to empty trash'"
  dry_run: "osascript -e 'tell application \"Finder\" to count items in trash'"
  irreversible: true
estimate:
  typical_size: "0 至数十 GB，随近期删除内容波动"
  recovery: none
refs:
  - https://support.apple.com/zh-cn/guide/mac-help/mchlp1093/mac
