apiVersion: slimit.rules/v1
id: macos-adobe-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/Adobe"
semantics:
  title: "Adobe 全家桶缓存（~/Library/Caches/Adobe）"
  what: "Adobe 应用（Photoshop/Premiere/Illustrator 等与 Creative Cloud）的缓存总目录：字体缓存、媒体缓存索引、机器学习模型缓存、更新缓存等，重度用户常见 5–20 GB"
  producer: "Adobe Creative Cloud 各应用"
  safe_to_delete_because: "位于 macOS 约定的 Caches 目录，按 Apple 文件系统规范其内容必须是应用可自行重建的数据；各应用启动时按需重建"
  consequence: "各 Adobe 应用首次启动与打开文件会重建缓存，Premiere 大项目需重新生成媒体缓存索引，短期变慢；个别应用可能要求重新登录 Creative Cloud 一次；文档与素材本身不受影响"
  regenerate: "应用运行时按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "5–20 GB（重度 Adobe 用户）"
  recovery: full
refs:
  - https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/FileSystemProgrammingGuide/FileSystemOverview/FileSystemOverview.html
