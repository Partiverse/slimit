apiVersion: slimit.rules/v1
id: macos-coursier-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/Coursier"
semantics:
  title: "Coursier Scala 构件缓存（~/Library/Caches/Coursier）"
  what: "Coursier（Scala 生态默认依赖解析器，sbt/Mill/scala-cli 底层共用）的 jar/构件下载缓存，按 Maven 坐标目录存放"
  producer: "Coursier（sbt / scala-cli / coursier fetch）"
  safe_to_delete_because: "纯下载缓存：Coursier 文档说明缓存可随时删除，下次构建按 ivy/maven 坐标重新下载"
  consequence: "下次构建 Scala 项目需重新下载依赖 jar，需网络；项目源码与编译产物不受影响"
  regenerate: "sbt compile / scala-cli compile 自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "1–5 GB（Scala 开发者）"
  recovery: full
refs:
  - https://get-coursier.io/docs/cache
