apiVersion: slimit.rules/v1
id: macos-baidunetdisk-advice
os: macos
scope: user
paths:
  - "~/Library/Containers/com.baidu.BaiduNetdiskMac"
semantics:
  title: "百度网盘容器（下载文件与缓存）"
  what: "百度网盘 macOS 沙盒容器：下载的文件、同步目录与缓存混在一起。开了自动备份/同步的机器常达数十 GB"
  producer: "百度网盘（下载/同步时写入）"
  safe_to_delete_because: "不建议工具代删：容器内混有用户下载的文件（可能仅存于此，云端可能已过期或未上传）与缓存。请在网盘设置中确认同步/备份范围，或使用应用内清理"
  consequence: "工具不代删；仅存于本地的下载文件删除后若云端已过期将永久丢失"
  regenerate: "缓存随使用重新产生；下载文件不会自动恢复"
risk: yellow
red_flags:
  - "容器内混有仅存于本地的用户下载文件，代删可能造成永久丢失"
action:
  kind: advise
estimate:
  typical_size: "数 GB 到数十 GB（同步/备份用户）"
  recovery: none
refs:
  - https://pan.baidu.com/
