apiVersion: slimit.rules/v1
id: macos-dropbox-cache
os: macos
scope: user
paths:
  - "~/Dropbox/.dropbox.cache"
semantics:
  title: "Dropbox 桌面客户端缓存（~/Dropbox/.dropbox.cache）"
  what: "Dropbox 桌面客户端为已删除/移动文件保留的暂存缓存：删除或移动文件时先把内容移入此处，防止误删；长期累积可达数 GB"
  producer: "Dropbox 桌面客户端"
  safe_to_delete_because: "Dropbox 官方说明该缓存仅用于近期误删恢复的临时暂存，会自动清理旧内容；手动清空不影响已同步的云端与本地文件"
  consequence: "近期删除的文件不再能从本地缓存直接恢复（云端回收站 30 天内仍可恢复）；同步中的文件不受影响"
  regenerate: "按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（重度用户）"
  recovery: full
refs:
  - https://help.dropbox.com/syncing-uploads/cache-folder
