apiVersion: slimit.rules/v1
id: macos-firefox-cache
os: macos
scope: user
paths:
  - "~/Library/Caches/Firefox"
semantics:
  title: "Firefox 浏览器缓存（~/Library/Caches/Firefox）"
  what: "Firefox 的 HTTP 网页资源缓存与启动缓存。用户数据（书签、历史、密码、Cookie）存放在 ~/Library/Profiles 的 profile 目录，不在此处"
  producer: "Mozilla Firefox"
  safe_to_delete_because: "全部为浏览器自动生成的派生数据；Mozilla 文档明确 Caches/Firefox 属于可重建缓存，与存放用户数据的 profile 目录分离"
  consequence: "登录状态、密码、书签、历史均不受影响；之后首次访问网站需重新下载资源，加载略慢"
  regenerate: "Firefox 运行中按需自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 至数 GB"
  recovery: full
refs:
  - https://support.mozilla.org/kb/profiles-where-firefox-stores-user-data
