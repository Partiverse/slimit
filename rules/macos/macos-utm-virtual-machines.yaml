apiVersion: slimit.rules/v1
id: macos-utm-virtual-machines
os: macos
scope: user
paths:
  - "~/Library/Containers/com.utmapp.UTM/Data/Documents"
semantics:
  title: "UTM 虚拟机库（.utm 虚拟机包）"
  what: "UTM（macOS 开源虚拟机）默认存放 .utm 虚拟机包的目录：每个包含该虚拟机的整块磁盘镜像、配置与快照"
  producer: "UTM"
  safe_to_delete_because: "不可直接删除——等于删除整台虚拟机及其磁盘上的全部数据"
  consequence: "对应虚拟机连同其操作系统、文件、快照全部永久丢失"
  regenerate: "只能从头新建虚拟机并重装系统；磁盘内数据不可恢复"
risk: red
red_flags:
  - "目录内容是完整虚拟机（磁盘镜像 + 快照），不是缓存"
  - "确实不需要的虚拟机应在 UTM 应用内删除，而非文件系统层直接清理"
action:
  kind: advise
estimate:
  typical_size: "每台虚拟机数 GB 到数百 GB"
  recovery: none
refs:
  - https://docs.getutm.app/
