apiVersion: slimit.rules/v1
id: linux-rustup-downloads
os: linux
scope: user
paths:
  - "~/.rustup/downloads"
semantics:
  title: "rustup 下载缓存（~/.rustup/downloads）"
  what: "rustup 下载的 toolchain 与组件安装包缓存（tarball），用于重复安装或离线安装"
  producer: "rustup（rustup install / rustup update）"
  safe_to_delete_because: "纯下载缓存：删除后 rustup 重新下载；已安装的 toolchain 不受影响"
  consequence: "下次 rustup install 需重新下载安装包（需网络）；已安装的 toolchain 完全不受影响"
  regenerate: "rustup install 自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB（多 toolchain 常见）"
  recovery: full
refs:
  - https://rust-lang.github.io/rustup/installation/index.html
