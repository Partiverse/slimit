apiVersion: slimit.rules/v1
id: linux-cypress-cache
os: linux
scope: user
paths:
  - "~/.cache/Cypress"
semantics:
  title: "Cypress 浏览器缓存（~/.cache/Cypress）"
  what: "Cypress 测试框架下载的浏览器二进制文件缓存"
  producer: "Cypress（cypress install）"
  safe_to_delete_because: "纯下载缓存：删除后下次运行 Cypress 时自动重新下载；测试代码与配置不受影响"
  consequence: "下次运行需重新下载浏览器（首次变慢，需网络）；功能完全不受影响"
  regenerate: "Cypress 自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "100 MB 到 500 MB（单个浏览器）"
  recovery: full
refs:
  - https://docs.cypress.io/app/get-started/install-cypress
