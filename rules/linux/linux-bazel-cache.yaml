apiVersion: slimit.rules/v1
id: linux-bazel-cache
os: linux
scope: user
paths:
  - "~/.cache/bazel"
semantics:
  title: "Bazel 构建缓存（~/.cache/bazel）"
  what: "Bazel 构建系统的输出仓库与缓存（action 缓存、仓库缓存）"
  producer: "Bazel（bazel build / bazel test）"
  safe_to_delete_because: "纯构建缓存：删除后 Bazel 重新构建；项目源码与 WORKSPACE/BUILD 文件不受影响"
  consequence: "下次构建需重新执行所有 action（首次变慢）；功能与结果完全不受影响"
  regenerate: "bazel build 自动重新构建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多项目常见）"
  recovery: full
refs:
  - https://bazel.build/run/build
