apiVersion: slimit.rules/v1
id: linux-node-gyp-cache
os: linux
scope: user
paths:
  - "~/.node-gyp"
semantics:
  title: "node-gyp 编译缓存（~/.node-gyp）"
  what: "node-gyp 编译原生 Node 模块时下载的头文件与构建产物缓存"
  producer: "node-gyp（npm install 触发原生模块编译时）"
  safe_to_delete_because: "纯下载与构建缓存：删除后下次编译时 node-gyp 重新下载头文件；已安装的原生模块不受影响"
  consequence: "下次安装原生模块需重新下载头文件并编译（首次变慢）；功能完全不受影响"
  regenerate: "node-gyp 自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数十 MB 到数百 MB"
  recovery: full
refs:
  - https://github.com/nodejs/node-gyp
