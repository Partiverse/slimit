apiVersion: slimit.rules/v1
id: linux-playwright-browsers
os: linux
scope: user
paths:
  - "~/.cache/ms-playwright"
semantics:
  title: "Playwright 浏览器缓存（~/.cache/ms-playwright）"
  what: "Playwright 下载的 Chromium、Firefox、WebKit 浏览器二进制文件缓存"
  producer: "Playwright（playwright install）"
  safe_to_delete_because: "纯下载缓存：删除后下次运行 Playwright 时自动重新下载；脚本与项目代码不受影响"
  consequence: "下次运行需重新下载浏览器（首次变慢，需网络）；功能完全不受影响"
  regenerate: "Playwright 自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多浏览器）"
  recovery: full
refs:
  - https://playwright.dev/docs/browsers
