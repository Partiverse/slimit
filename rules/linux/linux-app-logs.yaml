apiVersion: slimit.rules/v1
id: linux-app-logs
os: linux
scope: user
paths:
  - "~/.local/share/logs"
semantics:
  title: "用户级应用日志（~/.local/share/logs）"
  what: "各应用（浏览器、IDE、包管理器等）的运行日志、错误日志、调试日志"
  producer: "各应用（应用启动、运行、调试时）"
  safe_to_delete_because: "纯日志：删除后应用自动重新生成；应用配置、数据、用户数据均不受影响"
  consequence: "历史日志丢失，故障排查时无历史记录；应用功能完全不受影响"
  regenerate: "应用自动重新生成"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数十 MB 到数百 MB（多应用常见）"
  recovery: full
refs:
  - https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/FileSystemProgrammingGuide/MacOSXDirectories/MacOSXDirectories.html
