apiVersion: slimit.rules/v1
id: linux-teams-cache
os: linux
scope: user
paths:
  - "~/.cache/teams"
semantics:
  title: "Microsoft Teams 缓存（~/.cache/teams）"
  what: "Microsoft Teams 客户端的图片、文件、缓存数据"
  producer: "Microsoft Teams 客户端"
  safe_to_delete_because: "纯缓存数据：删除后 Teams 自动重新下载；聊天记录、频道设置、用户数据均不受影响"
  consequence: "已缓存的图片/文件需重新下载；聊天记录与功能完全不受影响"
  regenerate: "Teams 运行时按需自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB"
  recovery: full
refs:
  - https://learn.microsoft.com/en-us/microsoftteams/new-teams-faq
