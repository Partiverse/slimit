apiVersion: slimit.rules/v1
id: linux-discord-cache
os: linux
scope: user
paths:
  - "~/.config/discord/Cache"
semantics:
  title: "Discord 缓存（~/.config/discord/Cache）"
  what: "Discord 客户端（Linux，Electron）用户数据目录下的 HTTP/媒体缓存子目录；Discord 的 Electron userData 位于 ~/.config/discord，缓存（Cache、Code Cache）在其下"
  producer: "Discord 客户端"
  safe_to_delete_because: "纯缓存：删除后 Discord 自动重新下载；聊天记录、服务器设置、登录态（存于 ~/.config/discord 其他子目录）均不受影响"
  consequence: "已缓存的图片/视频需重新下载；聊天记录与功能完全不受影响"
  regenerate: "Discord 运行时按需自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多服务器/多频道常见）"
  recovery: full
refs:
  - https://support.discord.com/
