apiVersion: slimit.rules/v1
id: linux-crash-reports
os: linux
scope: user
paths:
  - "~/.local/share/xdg-user-dirs/logs"
semantics:
  title: "用户级崩溃报告（~/.local/share/logs）"
  what: "各应用的崩溃报告、诊断报告、错误日志"
  producer: "各应用（应用崩溃、错误时）"
  safe_to_delete_because: "纯日志：删除后应用自动重新生成；应用配置、数据、用户数据均不受影响"
  consequence: "历史崩溃报告丢失，故障排查时无历史记录；应用功能完全不受影响"
  regenerate: "应用自动重新生成"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数十 MB 到数百 MB（多应用常见）"
  recovery: full
refs:
  - https://developer.apple.com/documentation/xcode/diagnosing-issues-using-crash-reports-and-device-logs
