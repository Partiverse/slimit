apiVersion: slimit.rules/v1
id: linux-bun-cache
os: linux
scope: user
paths:
  - "~/.bun/install/cache"
semantics:
  title: "Bun 安装缓存（~/.bun/install/cache）"
  what: "Bun 安装/下载包时缓存的 tarball 与元数据，用于加速重复安装"
  producer: "Bun（bun install / bun add）"
  safe_to_delete_because: "纯下载缓存，已安装的 node_modules 与全局包不受影响；包内容可随时从 registry 重新获取"
  consequence: "下次 bun install 需重新联网下载包，离线或网络受限时安装变慢；Bun 本身与已装项目均正常工作"
  regenerate: "执行任意 bun install 时按需自动重新下载并重建缓存"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 至数 GB（重度使用者可达 10+ GB）"
  recovery: full
refs:
  - https://bun.sh/docs/install/cache
