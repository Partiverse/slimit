apiVersion: slimit.rules/v1
id: linux-adobe-cache
os: linux
scope: user
paths:
  - "~/.cache/Adobe"
semantics:
  title: "Adobe 缓存（~/.cache/Adobe）"
  what: "Adobe 应用（Photoshop、Illustrator、Premiere 等）的缓存文件、临时文件、缩略图缓存"
  producer: "Adobe 应用"
  safe_to_delete_because: "纯缓存：删除后 Adobe 应用自动重新生成；项目文件、设置、用户数据均不受影响"
  consequence: "下次启动需重新生成缓存（首次变慢）；功能完全不受影响"
  regenerate: "Adobe 应用自动重新生成"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多应用常见）"
  recovery: full
refs:
  - https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/FileSystemProgrammingGuide/FileSystemOverview/FileSystemOverview.html
