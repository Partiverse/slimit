apiVersion: slimit.rules/v1
id: linux-slack-cache
os: linux
scope: user
paths:
  - "~/.cache/slack"
semantics:
  title: "Slack 缓存（~/.cache/slack）"
  what: "Slack 客户端的图片、文件、Emoji 缓存"
  producer: "Slack 客户端"
  safe_to_delete_because: "纯媒体缓存：删除后 Slack 自动重新下载；聊天记录、频道设置、用户数据均不受影响"
  consequence: "已缓存的图片/文件需重新下载；聊天记录与功能完全不受影响"
  regenerate: "Slack 运行时按需自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多工作区常见）"
  recovery: full
refs:
  - https://slack.com/help/articles/115004071768
