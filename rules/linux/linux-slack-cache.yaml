apiVersion: slimit.rules/v1
id: linux-slack-cache
os: linux
scope: user
paths:
  - "~/.config/slack/Cache"
semantics:
  title: "Slack 缓存（~/.config/slack/Cache）"
  what: "Slack 客户端（Linux，Electron）用户数据目录下的 HTTP/媒体缓存子目录；Slack 的 Electron userData 位于 ~/.config/slack，缓存（Cache、Code Cache）在其下"
  producer: "Slack 客户端"
  safe_to_delete_because: "纯缓存：删除后 Slack 自动重新下载；聊天记录、工作区设置、登录态（存于 ~/.config/slack 其他子目录）均不受影响"
  consequence: "已缓存的图片/文件需重新下载；聊天记录与功能完全不受影响"
  regenerate: "Slack 运行时按需自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多工作区常见）"
  recovery: full
refs:
  - https://slack.com/help/articles/115004071768
