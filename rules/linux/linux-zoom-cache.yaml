apiVersion: slimit.rules/v1
id: linux-zoom-cache
os: linux
scope: user
paths:
  - "~/.cache/zoom"
semantics:
  title: "Zoom 缓存（~/.cache/zoom）"
  what: "Zoom 客户端的图片、文件、聊天缓存"
  producer: "Zoom 客户端"
  safe_to_delete_because: "纯缓存数据：删除后 Zoom 自动重新下载；聊天记录、会议设置、用户数据均不受影响"
  consequence: "已缓存的图片/文件需重新下载；聊天记录与功能完全不受影响"
  regenerate: "Zoom 运行时按需自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多会议/多文件常见）"
  recovery: full
refs:
  - https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/FileSystemProgrammingGuide/FileSystemOverview/FileSystemOverview.html
