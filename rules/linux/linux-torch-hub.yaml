apiVersion: slimit.rules/v1
id: linux-torch-hub
os: linux
scope: user
paths:
  - "~/.cache/torch/hub"
semantics:
  title: "PyTorch Hub 缓存（~/.cache/torch/hub）"
  what: "PyTorch Hub 下载的模型（torch.hub.load 缓存）与预训练权重"
  producer: "PyTorch（torch.hub.load / torch.hub.load_state_dict_from_url）"
  safe_to_delete_because: "纯下载缓存：删除后下次加载时重新下载；模型代码与配置不受影响"
  consequence: "已下载的模型需重新下载（需网络，模型文件通常数 GB）；功能完全不受影响"
  regenerate: "torch.hub.load 自动重新下载"
risk: yellow
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多模型常见）"
  recovery: partial
refs:
  - https://pytorch.org/docs/stable/hub.html
