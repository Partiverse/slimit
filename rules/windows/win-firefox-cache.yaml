apiVersion: slimit.rules/v1
id: win-firefox-cache
os: windows
scope: user
paths:
  - "~/AppData/Local/Mozilla/Firefox/Profiles/*/cache2"
semantics:
  title: "Firefox 浏览器缓存（各 profile 的 cache2）"
  what: "Firefox 各 profile 的 HTTP 网页资源缓存与启动缓存（cache2 目录，profile 目录带随机后缀，故用 glob 命中）。用户数据（书签、历史、密码、Cookie）存放在同一 profile 目录的其他子目录，不在此处"
  producer: "Mozilla Firefox"
  safe_to_delete_because: "cache2 全部为浏览器自动生成的派生数据；Mozilla 文档明确缓存目录可安全清除，与存放用户数据的文件（places.sqlite、logins.json 等）分离"
  consequence: "登录状态、密码、书签、历史均不受影响；之后首次访问网站需重新下载资源，加载略慢。Firefox 正在运行时清理一般也能自动恢复，稳妥起见建议先退出 Firefox"
  regenerate: "Firefox 运行中按需自动重建 cache2 目录"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 至数 GB"
  recovery: full
refs:
  - https://support.mozilla.org/kb/how-clear-firefox-cache
  - https://support.mozilla.org/kb/profiles-where-firefox-stores-user-data
