apiVersion: slimit.rules/v1
id: win-xcode-caches
os: windows
scope: user
paths:
  - "~/Library/Caches/com.apple.dt.Xcode"
semantics:
  title: "Xcode 缓存（~/Library/Caches/com.apple.dt.Xcode）"
  what: "Xcode 的索引缓存、预览缓存、Swift 模块缓存等"
  producer: "Xcode（IDE 启动、索引构建、预览时）"
  safe_to_delete_because: "纯缓存：删除后 Xcode 重新索引并生成；项目源码、.xcodeproj、Scheme 均不受影响"
  consequence: "下次启动 Xcode 需重新索引（首次变慢）；功能与结果完全不受影响"
  regenerate: "Xcode 自动重新生成"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多项目常见）"
  recovery: full
refs:
  - https://developer.apple.com/documentation/xcode
