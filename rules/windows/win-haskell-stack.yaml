apiVersion: slimit.rules/v1
id: win-haskell-stack
os: windows
scope: user
paths:
  - "~/.stack"
semantics:
  title: "Haskell Stack 缓存（~/.stack）"
  what: "Haskell Stack 下载的 GHC 编译器、包索引、构建产物缓存"
  producer: "Haskell Stack（stack build / stack install）"
  safe_to_delete_because: "纯下载与构建缓存：删除后 Stack 重新下载；项目源码与 stack.yaml 不受影响"
  consequence: "下次构建需重新下载 GHC 与包（需网络，首次变慢）；功能完全不受影响"
  regenerate: "stack build 自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多 GHC 版本常见）"
  recovery: full
refs:
  - https://docs.haskellstack.org/en/stable/stack_root/
