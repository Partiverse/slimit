apiVersion: slimit.rules/v1
id: win-crash-reports
os: windows
scope: user
paths:
  - "~/AppData/Local/CrashDumps"
  - "~/AppData/Local/Microsoft/Windows/WER/ReportArchive"
  - "~/AppData/Local/Microsoft/Windows/WER/ReportQueue"
semantics:
  title: "Windows 崩溃转储与错误报告（CrashDumps / WER）"
  what: "应用崩溃时的用户态转储（%LOCALAPPDATA%\\CrashDumps，需应用启用 LocalDumps 才生成）与 Windows 错误报告（WER）的待发送/已归档报告队列"
  producer: "Windows 错误报告（WER）与各应用"
  safe_to_delete_because: "纯诊断数据：删除后系统按需重新生成；应用配置、用户数据均不受影响"
  consequence: "历史崩溃报告丢失，故障排查时无历史记录；系统功能完全不受影响"
  regenerate: "WER 与应用按需重新生成"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数十 MB 到数百 MB"
  recovery: full
refs:
  - https://learn.microsoft.com/windows/win32/wer/collecting-user-mode-dumps
