apiVersion: slimit.rules/v1
id: win-discord-cache
os: windows
scope: user
paths:
  - "~/AppData/Roaming/discord/Cache"
semantics:
  title: "Discord 缓存（~/AppData/Roaming/discord/Cache）"
  what: "Discord 客户端的图片、视频、贴纸等媒体缓存"
  producer: "Discord 客户端"
  safe_to_delete_because: "纯媒体缓存：删除后 Discord 自动重新下载；聊天记录、服务器设置、用户数据均不受影响"
  consequence: "已缓存的图片/视频需重新下载；聊天记录与功能完全不受影响"
  regenerate: "Discord 运行时按需自动重新下载"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多服务器/多频道常见）"
  recovery: full
refs:
  - https://support.discord.com/
