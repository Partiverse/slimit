apiVersion: slimit.rules/v1
id: win-huggingface-cache
os: windows
scope: user
paths:
  - "~/.cache/huggingface"
semantics:
  title: "Hugging Face 缓存（~/.cache/huggingface）"
  what: "Hugging Face Hub 下载的模型、数据集、分词器缓存（按 repo 组织）"
  producer: "Hugging Face Hub（transformers / diffusers / huggingface_hub）"
  safe_to_delete_because: "纯下载缓存：删除后下次使用时重新下载；模型配置与代码不受影响"
  consequence: "已下载的模型需重新下载（需网络，模型文件通常数 GB）；功能完全不受影响"
  regenerate: "Hugging Face Hub 自动重新下载"
risk: yellow
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数 GB 到数十 GB（多模型常见）"
  recovery: partial
refs:
  - https://huggingface.co/docs/huggingface_hub/en/guides/manage-cache
