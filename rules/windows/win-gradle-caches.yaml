apiVersion: slimit.rules/v1
id: win-gradle-caches
os: windows
scope: user
paths:
  - "~/.gradle/caches"
semantics:
  title: "Gradle 构建缓存（~/.gradle/caches）"
  what: "Gradle 构建产物缓存（编译输出、依赖下载、构建缓存）与本地 Maven 仓库（build-scan 插件数据等）"
  producer: "Gradle（gradle build / gradle test 等）"
  safe_to_delete_because: "纯构建缓存：删除后下次构建时 Gradle 重新下载依赖并重新编译；项目源码与配置不受影响"
  consequence: "下次构建需重新下载依赖并重新编译，首次构建耗时变长；功能与结果完全不受影响"
  regenerate: "下次 gradle build 时自动重建"
risk: green
action:
  kind: purge-dir
  delete_contents_only: true
estimate:
  typical_size: "数百 MB 到数 GB（多项目/多版本常见）"
  recovery: full
refs:
  - https://docs.gradle.org/current/userguide/directory_layout.html
