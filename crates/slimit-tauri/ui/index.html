<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slimit</title>
    <script>
      // 真机诊断：React 未捕获错误会让整棵渲染树白屏且 stderr 无输出，
      // 把错误写进窗口标题（AX 可读），定位后此钩子保留（标题以 ERR: 前缀可见）。
      window.addEventListener("error", (e) => {
        document.title = "ERR: " + e.message + " @" + (e.filename || "") + ":" + (e.lineno || 0);
      });
      window.addEventListener("unhandledrejection", (e) => {
        document.title = "REJ: " + String(e.reason).slice(0, 200);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
